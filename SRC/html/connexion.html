<!DOCTYPE html>
<html lang="fr" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <<link rel="stylesheet" href="./../../SRC/output.css">

    <style>
        /* =========================================================
           TES VARIABLES
        ========================================================= */

        :root {
            --color-primary: #17365d;
            --color-secondary: #d89b16;
            --color-bg: #f5f7fa;
            --color-card: #ffffff;
            --color-text: #172033;
            --color-muted: #667085;
            --color-border: #dfe4ea;
        }

        .dark {
            --color-primary: #60a5fa;
            --color-secondary: #e7b84b;
            --color-bg: #0d1726;
            --color-card: #142235;
            --color-text: #f1f5f9;
            --color-muted: #94a3b8;
            --color-border: #26364a;
        }

        @theme {
            --color-cdj-primary: var(--color-primary);
            --color-cdj-secondary: var(--color-secondary);
            --color-cdj-bg: var(--color-bg);
            --color-cdj-card: var(--color-card);
            --color-cdj-text: var(--color-text);
            --color-cdj-muted: var(--color-muted);
            --color-cdj-border: var(--color-border);

            --color-cdj-piete: #7c3aed;
            --color-cdj-foi: #0284c7;
            --color-cdj-honnete: #059669;
            --color-cdj-engagement: #dc2626;
            --color-cdj-gold: #d89b16;
        }


        /* =========================================================
           TRANSITIONS GLOBALES
        ========================================================= */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--color-bg);
            color: var(--color-text);
            transition:
                background-color .35s ease,
                color .35s ease;
        }


        /* =========================================================
           SIDEBAR DESKTOP
        ========================================================= */

        .sidebar {
            background: var(--color-card);
            border-color: var(--color-border);
        }

        .sidebar-link {
            position: relative;

            display: flex;
            align-items: center;
            gap: 13px;

            width: 100%;

            padding: 11px 13px;

            border-radius: 12px;

            color: var(--color-muted);

            transition:
                color .22s ease,
                background-color .22s ease,
                transform .22s ease;
        }

        .sidebar-link:hover {
            color: var(--color-text);
            background: color-mix(
                in srgb,
                var(--color-primary) 6%,
                transparent
            );

            transform: translateX(2px);
        }

        .sidebar-link.active {
            color: var(--color-primary);

            background: color-mix(
                in srgb,
                var(--color-primary) 10%,
                transparent
            );
        }

        .sidebar-link.active::before {
            content: "";

            position: absolute;
            left: -1px;
            top: 50%;

            width: 3px;
            height: 22px;

            border-radius: 999px;

            background: var(--color-primary);

            transform: translateY(-50%);

            animation: activeBar .25s ease-out;
        }

        @keyframes activeBar {
            from {
                height: 0;
                opacity: 0;
            }

            to {
                height: 22px;
                opacity: 1;
            }
        }


        /* =========================================================
           ICONES
        ========================================================= */

        .nav-icon {
            width: 21px;
            height: 21px;

            flex-shrink: 0;

            transition:
                transform .22s ease,
                stroke-width .22s ease;
        }

        .sidebar-link:hover .nav-icon {
            transform: scale(1.06);
        }

        .sidebar-link.active .nav-icon {
            stroke-width: 2.2;
        }


        /* =========================================================
           MODE SOMBRE
        ========================================================= */

        .theme-button {
            color: var(--color-muted);

            transition:
                background-color .2s ease,
                color .2s ease,
                transform .2s ease;
        }

        .theme-button:hover {
            color: var(--color-text);

            background: color-mix(
                in srgb,
                var(--color-primary) 7%,
                transparent
            );

            transform: translateY(-1px);
        }


        /* =========================================================
           BOTTOM NAVIGATION MOBILE
        ========================================================= */

        .mobile-nav {
            background: color-mix(
                in srgb,
                var(--color-card) 94%,
                transparent
            );

            border-color: var(--color-border);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .mobile-link {
            position: relative;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 4px;

            min-width: 58px;

            color: var(--color-muted);

            transition:
                color .2s ease,
                transform .2s ease;
        }

        .mobile-link:active {
            transform: scale(.94);
        }

        .mobile-link.active {
            color: var(--color-primary);
        }

        .mobile-link.active .mobile-icon-wrapper {
            background: color-mix(
                in srgb,
                var(--color-primary) 11%,
                transparent
            );

            transform: translateY(-1px);
        }

        .mobile-icon-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 38px;
            height: 30px;

            border-radius: 10px;

            transition:
                background-color .2s ease,
                transform .2s ease;
        }

        .mobile-icon {
            width: 20px;
            height: 20px;
        }

        .mobile-label {
            font-size: 10px;
            font-weight: 500;
            line-height: 1;
        }


        /* =========================================================
           MENU BURGER MOBILE
        ========================================================= */

        .mobile-menu {
            position: fixed;

            left: 12px;
            right: 12px;
            bottom: 76px;

            z-index: 50;

            padding: 8px;

            background: var(--color-card);
            border: 1px solid var(--color-border);

            border-radius: 18px;

            box-shadow:
                0 18px 50px rgba(15, 23, 42, .16);

            opacity: 0;
            visibility: hidden;

            transform:
                translateY(12px)
                scale(.98);

            transform-origin: bottom center;

            transition:
                opacity .22s ease,
                visibility .22s ease,
                transform .25s cubic-bezier(.2,.8,.2,1);
        }

        .dark .mobile-menu {
            box-shadow:
                0 18px 50px rgba(0, 0, 0, .35);
        }

        .mobile-menu.open {
            opacity: 1;
            visibility: visible;

            transform:
                translateY(0)
                scale(1);
        }

        .mobile-menu-item {
            display: flex;
            align-items: center;

            width: 100%;

            padding: 11px;

            border-radius: 12px;

            color: var(--color-muted);

            transition:
                background-color .2s ease,
                color .2s ease,
                transform .2s ease;
        }

        .mobile-menu-item:hover {
            color: var(--color-text);

            background: color-mix(
                in srgb,
                var(--color-primary) 6%,
                transparent
            );

            transform: translateX(2px);
        }

        .mobile-menu-item.active {
            color: var(--color-primary);

            background: color-mix(
                in srgb,
                var(--color-primary) 9%,
                transparent
            );
        }


        /* =========================================================
           OVERLAY MOBILE
        ========================================================= */

        .menu-overlay {
            position: fixed;
            inset: 0;

            z-index: 40;

            background: rgba(15, 23, 42, .12);

            backdrop-filter: blur(2px);

            opacity: 0;
            visibility: hidden;

            transition:
                opacity .22s ease,
                visibility .22s ease;
        }

        .menu-overlay.open {
            opacity: 1;
            visibility: visible;
        }


        /* =========================================================
           BADGE NOTIFICATION
        ========================================================= */

        .notification-badge {
            position: absolute;

            top: 3px;
            right: 6px;

            min-width: 15px;
            height: 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0 4px;

            border-radius: 999px;

            background: var(--color-cdj-engagement);
            color: white;

            font-size: 9px;
            font-weight: 700;

            border: 2px solid var(--color-card);
        }


        /* =========================================================
           LOGO
        ========================================================= */

        .logo-mark {
            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 11px;

            background: var(--color-primary);

            color: white;

            box-shadow:
                0 5px 14px color-mix(
                    in srgb,
                    var(--color-primary) 22%,
                    transparent
                );
        }


        /* =========================================================
           PETITE ANIMATION D'ENTRÉE
        ========================================================= */

        .dashboard-content {
            animation: dashboardEnter .35s ease-out;
        }

        @keyframes dashboardEnter {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 767px) {

            body {
                padding-bottom: 72px;
            }

            .desktop-sidebar {
                display: none;
            }
        }

        @media (min-width: 768px) {

            .mobile-bottom-nav {
                display: none;
            }

            .mobile-menu,
            .menu-overlay {
                display: none;
            }
        }
    </style>
</head>

<script>

    /* =============================================================
       NAVIGATION ACTIVE
    ============================================================= */

    const allNavLinks = document.querySelectorAll(
        "[data-page]"
    );

    function setActivePage(page) {

        allNavLinks.forEach(link => {

            if (link.dataset.page === page) {
                link.classList.add("active");
            } else {
                link.classList.remove("active");
            }

        });

        /*
         * Ici tu pourras plus tard connecter ton système
         * de routing / changement de contenu.
         */
    }


    allNavLinks.forEach(link => {

        link.addEventListener("click", () => {

            const page = link.dataset.page;

            setActivePage(page);

            closeMobileMenu();

        });

    });



    /* =============================================================
       MENU MOBILE
    ============================================================= */

    const mobileMenu = document.getElementById(
        "mobileMenu"
    );

    const mobileMenuButton = document.getElementById(
        "mobileMenuButton"
    );

    const menuOverlay = document.getElementById(
        "menuOverlay"
    );

    const burgerIcon = document.getElementById(
        "burgerIcon"
    );


    function openMobileMenu() {

        mobileMenu.classList.add("open");
        menuOverlay.classList.add("open");

        mobileMenuButton.setAttribute(
            "aria-expanded",
            "true"
        );

        /*
         * Transformation du burger en X
         */

        burgerIcon.innerHTML = `
            <path d="M6 6l12 12"/>
            <path d="M18 6 6 18"/>
        `;

    }


    function closeMobileMenu() {

        mobileMenu.classList.remove("open");
        menuOverlay.classList.remove("open");

        mobileMenuButton.setAttribute(
            "aria-expanded",
            "false"
        );

        burgerIcon.innerHTML = `
            <path d="M4 6h16"/>
            <path d="M4 12h16"/>
            <path d="M4 18h16"/>
        `;

    }


    function toggleMobileMenu() {

        if (mobileMenu.classList.contains("open")) {
            closeMobileMenu();
        } else {
            openMobileMenu();
        }

    }


    mobileMenuButton.addEventListener(
        "click",
        toggleMobileMenu
    );


    menuOverlay.addEventListener(
        "click",
        closeMobileMenu
    );


    document.addEventListener(
        "keydown",
        event => {

            if (event.key === "Escape") {
                closeMobileMenu();
            }

        }
    );



    /* =============================================================
       DARK / LIGHT MODE
    ============================================================= */

    const html = document.documentElement;

    const themeToggleDesktop =
        document.getElementById(
            "themeToggleDesktop"
        );

    const themeToggleMobile =
        document.getElementById(
            "themeToggleMobile"
        );

    const themeTextDesktop =
        document.getElementById(
            "themeTextDesktop"
        );

    const themeTextMobile =
        document.getElementById(
            "themeTextMobile"
        );


    function updateThemeUI() {

        const isDark =
            html.classList.contains("dark");


        themeTextDesktop.textContent =
            isDark ? "Sombre" : "Clair";

        themeTextMobile.textContent =
            isDark ? "Sombre" : "Clair";

    }


    function toggleTheme() {

        html.classList.toggle("dark");

        const isDark =
            html.classList.contains("dark");

        localStorage.setItem(
            "theme",
            isDark ? "dark" : "light"
        );

        updateThemeUI();

    }


    themeToggleDesktop.addEventListener(
        "click",
        toggleTheme
    );

    themeToggleMobile.addEventListener(
        "click",
        toggleTheme
    );


    /*
     * Restaurer le thème précédent
     */

    const savedTheme =
        localStorage.getItem("theme");

    if (savedTheme === "dark") {
        html.classList.add("dark");
    } else {
        html.classList.remove("dark");
    }

    updateThemeUI();



    /* =============================================================
       INITIALISATION
    ============================================================= */

    setActivePage("activite");

</>

</body>
</html>
