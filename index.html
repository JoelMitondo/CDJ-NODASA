<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>CDJ NODASA</title>
  <link rel="stylesheet" href="./SRC/output.css">
    <script type="module" src="./SRC/JS/scripts.js"></script>
</head>
<body class="bg-cdj-bg text-cdj-text transition-colors duration-300">

  <!-- En-tête -->
  <header class="bg-cdj-card border-b border-cdj-border p-4 flex justify-between items-center">
    <h1 class="text-cdj-primary font-bold text-xl">CDJ NODASA</h1>
    
    <!-- Bouton pour basculer le thème -->
    <button onclick="toggleTheme()" class="p-2 bg-cdj-bg border border-cdj-border rounded-lg text-sm">
      🌙 / ☀️ Mode
    </button>
  </header>

  <!-- Carte d'un groupe -->
  <main class="p-6">
    <div class="bg-cdj-card border border-cdj-border p-4 rounded-xl shadow-sm">
      <h2 class="text-cdj-secondary font-semibold text-lg">Groupe Scout</h2>
      <p class="mt-2">Formation et activités de la jeunesse.</p>
    </div>

    <div class="flex items-center gap-4">
      <!-- Sélecteur de Langue -->
      <select id="lang-select" class="bg-cdj-bg border border-cdj-border p-2 rounded-lg text-sm font-medium">
        <option value="fr">🇫🇷 Français</option>
        <option value="en">🇬🇧 English</option>
        <option value="la">🇻🇦 Latina</option>
      </select>

    </div>
    <!-- Exemple dans index.html -->
<a href="index.html" data-i18n="navigation.accueil">Accueil</a>
<h1 data-i18n="accueil.titre">Commission Diocésaine des Jeunes</h1>
<button data-i18n="presence.present">Présent</button>
  </main>

</body>
<script>
    // Au chargement de la page : appliquer le thème sauvegardé ou la préférence du système
const savedTheme = localStorage.getItem('theme');
const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
  document.documentElement.classList.add('dark');
} else {
  document.documentElement.classList.remove('dark');
}

// Fonction pour basculer le thème au clic sur un bouton
function toggleTheme() {
  const isDark = document.documentElement.classList.toggle('dark');
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
</script>
</html>
